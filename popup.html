<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video preview</title>

    html, body { margin: 0; height: 100%; background: #111; color: #fff; font: 13px system-ui, sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #msg { display: none; height: 100%; align-items: center; justify-content: center; text-align: center; padding: 16px; }

  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media"></iframe>

</body>
</html>
