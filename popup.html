<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #fff; font: 13px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    iframe { border: 0; width: 100%; flex: 1 1 auto; min-height: 0; display: block; }
    #msg { display: none; flex: 1 1 auto; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    footer { flex: 0 0 auto; padding: 6px 10px; text-align: right; background: #1b1b1d; }
    a { color: #ffd400; text-decoration: none; }
  </style>
</head>
<body>
  <iframe id="frame" allow="autoplay; fullscreen; encrypted-media"></iframe>
  <div id="msg"></div>
  <footer><a id="open" target="_blank" rel="noopener">Open link &#8599;</a></footer>
  <script src="embed-url.js"></script>
  <script src="popup.js"></script>
</body>
</html>
